[package]
name = "hataori-tutorial-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Runnable source for the Hataori online tutorials"

[features]
default = []
rayon = ["hataori/rayon", "dep:rayon"]
mpi = ["hataori/mpi", "dep:mpi-upstream", "dep:serde"]
rsmpi-rt = ["hataori/rsmpi-rt", "dep:mpi-runtime", "dep:serde"]

[dependencies]
hataori = { path = "../..", default-features = false }
rayon = { version = "1.10", optional = true }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
mpi-runtime = { package = "mpi", git = "https://github.com/tensor4all/rsmpi-rt", rev = "6db6a2d6f96115b17c9a925e53ce719797c15dbb", default-features = false, features = ["mpi-rt-sys-backend"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[[bin]]
name = "serial_map"
path = "src/bin/serial_map.rs"

[[bin]]
name = "rayon_map_in"
path = "src/bin/rayon_map_in.rs"
required-features = ["rayon"]

[[bin]]
name = "mpi_pmap"
path = "src/bin/mpi_pmap.rs"

[[bin]]
name = "mpi_placement"
path = "src/bin/mpi_placement.rs"

[[bin]]
name = "hybrid_pmap"
path = "src/bin/hybrid_pmap.rs"

[[test]]
name = "tutorial_binaries"
path = "tests/tutorial_binaries.rs"
