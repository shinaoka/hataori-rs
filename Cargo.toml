[package]
name = "hataori"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Synchronous serial, Rayon, and MPI data-parallel execution"

[features]
default = []
rayon = ["dep:rayon"]
mpi = ["dep:mpi-upstream", "dep:serde", "dep:bincode"]
rsmpi-rt = ["dep:mpi-runtime", "dep:serde", "dep:bincode"]

[dependencies]
rayon = { version = "1.10", optional = true }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
mpi-runtime = { package = "mpi", git = "https://github.com/tensor4all/rsmpi-rt", rev = "065cc7622c6ad72b6bcbc808296aaf597ff56b70", default-features = false, features = ["mpi-rt-sys-backend"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "2", default-features = false, features = ["serde", "std"], optional = true }
