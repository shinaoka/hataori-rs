[workspace]
members = ["adapters/tenferro", "crates/hataori-runtime-foundation", "crates/hataori-runtime"]
default-members = ["."]
resolver = "2"

[package]
name = "hataori"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Synchronous serial, Rayon, and MPI data-parallel execution"

[features]
default = []
rayon = ["dep:rayon", "dep:libc"]
mpi = ["dep:mpi-upstream", "dep:serde", "dep:bincode"]
rsmpi-rt = ["dep:mpi-runtime", "dep:serde", "dep:bincode"]
tenferro = ["dep:tenferro-tensor"]

[dependencies]
rayon = { version = "1.10", optional = true }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
mpi-runtime = { package = "mpi", git = "https://github.com/tensor4all/rsmpi-rt", rev = "6db6a2d6f96115b17c9a925e53ce719797c15dbb", default-features = false, features = ["mpi-rt-sys-backend"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "2", default-features = false, features = ["serde", "std"], optional = true }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "a21a4c602fc6700b9bc0c3f1b14ebd19b9d7ec45", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "mpi_pmap_smoke"
required-features = ["mpi"]

[[example]]
name = "rsmpi_rt_pmap_smoke"
required-features = ["rsmpi-rt"]

[[example]]
name = "mpi_placement_smoke"
required-features = ["mpi"]

[[example]]
name = "mpi_pi_raw"
required-features = ["mpi"]

[[example]]
name = "mpi_pi_pmap"
required-features = ["mpi"]

[[example]]
name = "mpi_mandelbrot_raw"
required-features = ["mpi", "tenferro"]

[[example]]
name = "mpi_mandelbrot_pmap"
required-features = ["mpi", "tenferro"]

[[example]]
name = "mpi_mandelbrot_placement"
required-features = ["mpi", "tenferro"]

[[example]]
name = "serial_mandelbrot"
required-features = ["tenferro"]

[[example]]
name = "rsmpi_rt_placement_smoke"
required-features = ["rsmpi-rt"]

[[example]]
name = "rayon_mandelbrot"
required-features = ["rayon", "tenferro"]

[[example]]
name = "mpi_mandelbrot_hybrid"
required-features = ["mpi", "rayon", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_pmap"
required-features = ["rsmpi-rt", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_placement"
required-features = ["rsmpi-rt", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_hybrid"
required-features = ["rsmpi-rt", "rayon", "tenferro"]
